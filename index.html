<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard | Shubham Bhoir</title>
    <style>
        :root {
            --bg-start: #0f0c29; --bg-mid: #302b63; --bg-end: #24243e;
            --panel: rgba(255, 255, 255, 0.05);
            --accent-blue: #00d2ff; --accent-purple: #9d50bb; --accent-green: #00ff88;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%; max-width: 450px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 { font-weight: 200; letter-spacing: 5px; text-transform: uppercase; color: #fff; margin-bottom: 30px; }

        input {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent-blue); padding: 12px; border-radius: 8px;
            width: 100%; box-sizing: border-box; font-family: monospace;
            font-size: 1.2rem; text-align: center; margin-bottom: 20px;
        }

        textarea {
            width: 100%; height: 180px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1); color: #fff;
            border-radius: 12px; padding: 15px; box-sizing: border-box;
            font-size: 1rem; resize: none; margin-bottom: 20px;
        }

        .code-box {
            background: rgba(0, 210, 255, 0.1); border: 1px dashed var(--accent-blue);
            padding: 15px; border-radius: 12px; margin-bottom: 20px; display: none;
        }

        .code-box span { display: block; font-size: 1.8rem; font-weight: bold; color: var(--accent-blue); letter-spacing: 4px; }

        .zones { display: flex; gap: 15px; margin-bottom: 15px; }

        button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }

        .btn-push { background: linear-gradient(to right, #00d2ff, #3a7bd5); color: white; }
        .btn-fetch { background: linear-gradient(to right, #9d50bb, #6e48aa); color: white; }
        .btn-copy { background: transparent; border: 1px solid var(--accent-green); color: var(--accent-green); margin-top: 10px;}

        footer { margin-top: 40px; font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.4); }
        #status-text { font-size: 0.75rem; margin-top: 15px; display: block; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CLIPBOARD</h1>

        <input type="text" id="roomCode" placeholder="Enter Code to Fetch">

        <textarea id="box" placeholder="Start typing..."></textarea>

        <div id="codeDisplay" class="code-box">
            <small style="color:var(--accent-blue)">SHARE THIS CODE:</small>
            <span id="generatedCode">----</span>
        </div>

        <div class="zones">
            <button class="btn-push" onclick="pushData()">Push & Get Code</button>
            <button class="btn-fetch" onclick="fetchData()">Fetch Data</button>
        </div>

        <button class="btn-copy" onclick="copyText()">Copy to My Device</button>
        
        <span id="status-text">System Ready</span>

        <footer>Designed by Shubham Bhoir</footer>
    </div>

    <script>
        const API_URL = "https://online-clipboard-a68q.onrender.com"; 

        function setStatus(msg, color) {
            const status = document.getElementById('status-text');
            status.innerText = msg;
            status.style.color = color;
        }

        async function pushData() {
            const content = document.getElementById('box').value;
            if(!content) return alert("Please enter some text!");

            const autoCode = Math.floor(1000 + Math.random() * 9000).toString();
            setStatus("Generating...", "#00d2ff");

            try {
                const response = await fetch(`${API_URL}/save-text`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ room: autoCode, content: content })
                });
                if(response.ok) {
                    document.getElementById('codeDisplay').style.display = 'block';
                    document.getElementById('generatedCode').innerText = autoCode;
                    document.getElementById('roomCode').value = autoCode;
                    setStatus("Pushed Successfully!", "#00ff88");
                }
            } catch(e) {
                setStatus("Connection Error", "#ff4444");
            }
        }

        async function fetchData() {
            const code = document.getElementById('roomCode').value;
            if(!code) return alert("Enter a code!");

            setStatus("Fetching...", "#9d50bb");
            try {
                const response = await fetch(`${API_URL}/get-text/${code}`);
                const data = await response.json();
                if(data.content) {
                    document.getElementById('box').value = data.content;
                    setStatus("Data Received!", "#00ff88");
                } else {
                    setStatus("Code not found", "#ff4444");
                }
            } catch(e) {
                setStatus("Server waking up... wait 30s", "#ff4444");
            }
        }

        function copyText() {
            const text = document.getElementById('box').value;
            navigator.clipboard.writeText(text);
            setStatus("Copied!", "#00ff88");
            setTimeout(() => setStatus("System Ready", "#666"), 2000);
        }
    </script>
</body>
</html>

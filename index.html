<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard | Shubham Bhoir</title>
    <style>
        :root {
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --panel: rgba(255, 255, 255, 0.05);
            --accent-blue: #00d2ff;
            --accent-purple: #9d50bb;
            --accent-green: #00ff88;
            --error-red: #e74c3c;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: var(--panel);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 { 
            font-weight: 200; 
            letter-spacing: 5px; 
            margin-bottom: 30px;
            text-transform: uppercase;
            color: #fff;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        
        label {
            display: block;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        input {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent-blue);
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            transition: 0.3s;
        }

        textarea {
            width: 100%;

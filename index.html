<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard | Cinematic</title>
    <style>
       :root {
    --bg-start: #0f0c29;
    --bg-mid: #302b63;
    --bg-end: #24243e;
    --panel: rgba(255, 255, 255, 0.03);
    --accent-blue: #00d2ff;
    --accent-purple: #9d50bb;
    --accent-green: #00ff88;
}

body {
    margin: 0;
    /* This creates a deep, cinematic tri-color gradient */
    background: linear-gradient(135deg, var(--bg-start), var(--bg-mid), var(--bg-end));
    background-attachment: fixed;
    color: #e0e0e0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 480px;
    background: var(--panel);
    backdrop-filter: blur(20px); /* Increased blur for "Glass" look */
    padding: 40px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
}

h1 { 
    font-weight: 200; 
    letter-spacing: 5px; 
    text-align: center; 
    color: #fff; 
    margin-bottom: 30px;
    text-transform: uppercase;
}

/* Separation of the Input Areas */
.input-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
}

input {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    color: #00d2ff; /* Blue glow for the key */
    padding: 12px;
    border-radius: 8px;
    width: 100%;
    box-sizing: border-box;
    font-family: monospace;
    font-size: 1.2rem;
    text-align: center;
}

textarea {
    width: 100%;
    height: 180px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 12px;
    padding: 15px;
    box-sizing: border-box;
    font-size: 1rem;
    resize: none;
    margin-bottom: 25px;
}

/* Distinct Action Zones */
.zones-wrapper {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.action-card {
    flex: 1;
    background: rgba(255,255,255,0.02);
    padding: 15px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.05);
    text-align: center;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
}

.btn-push { 
    background: linear-gradient(to right, #00d2ff, #3a7bd5); 
    color: white; 
    box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
}

.btn-fetch { 
    background: linear-gradient(to right, #9d50bb, #6e48aa); 
    color: white;
    box-shadow: 0 4px 15px rgba(157, 80, 187, 0.3);
}

.btn-copy { 
    background: transparent;
    border: 1px solid var(--accent-green);
    color: var(--accent-green);
    margin-top: 10px;
}

.btn-copy:hover {
    background: var(--accent-green);
    color: #000;
}
    </style>
</head>
<body>

    <div class="container">
        <h1>CLIPBOARD</h1>

        <div class="key-section">
            <input type="text" id="roomCode" placeholder="Enter Secret Key">
        </div>

        <textarea id="box" placeholder="Paste or Type content..."></textarea>

        <div class="action-zones">
            <div class="zone">
                <small style="color: var(--accent-blue)">UPLOAD</small>
                <button class="btn-push" onclick="saveText()">Push to Cloud</button>
            </div>
            <div class="zone">
                <small style="color: var(--accent-purple)">DOWNLOAD</small>
                <button class="btn-fetch" onclick="getText()">Fetch from Cloud</button>
            </div>
        </div>

        <button class="btn-copy" onclick="copyToLocal()">Copy to My Device</button>
        
        <p style="text-align:center; font-size: 12px; opacity: 0.5; margin-top: 20px;">
            <span id="status-dot" class="status-dot"></span> <span id="status-text">System Ready</span>
        </p>
    </div>

    <script>
        // Update this to your Render URL later!
        const API_URL = "https://online-clipboard-a68q.onrender.com";
        
        function setStatus(msg, color) {
            document.getElementById('status-text').innerText = msg;
            document.getElementById('status-dot').style.backgroundColor = color;
        }

        async function saveText() {
            const code = document.getElementById('roomCode').value;
            const text = document.getElementById('box').value;
            if(!code) return alert("Enter a Secret Key!");

            setStatus("Syncing...", "#3d85c6");
            try {
                await fetch(`${API_URL}/save-text`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ room: code, content: text })
                });
                setStatus("Synced successfully", "#27ae60");
            } catch(e) {
                setStatus("Sync Failed", "#e74c3c");
            }
        }

        async function getText() {
            const code = document.getElementById('roomCode').value;
            if(!code) return alert("Enter a Key to fetch!");

            setStatus("Fetching...", "#8e44ad");
            try {
                const response = await fetch(`${API_URL}/get-text/${code}`);
                const data = await response.json();
                document.getElementById('box').value = data.content || "";
                setStatus("Data received", "#27ae60");
            } catch(e) {
                setStatus("Fetch Failed", "#e74c3c");
            }
        }

        async function copyToLocal() {
            const text = document.getElementById('box').value;
            await navigator.clipboard.writeText(text);
            setStatus("Copied to Clipboard!", "#27ae60");
            setTimeout(() => setStatus("System Ready", "#444"), 2000);
        }
    </script>
</body>
</html>
